<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS RETAIL OS — Управление заказами</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07090e;
            --bg-surface: #121824;
            --bg-card: rgba(18, 24, 36, 0.75);
            --border: #1f293d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.3);
            --success: #10b981;
            --warning: #f59e0b;
            --info: #06b6d4;
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --radius: 20px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 3rem;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.08) 0%, transparent 40%);
        }

        header {
            background: rgba(18, 24, 36, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--accent), var(--info));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: var(--accent);
        }

        .store-selector {
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .store-selector:focus, .store-selector:hover {
            border-color: var(--accent);
        }

        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
        }

        .metric-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .metric-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent);
        }

        .metric-card.success::after { background: var(--success); }
        .metric-card.warning::after { background: var(--warning); }
        .metric-card.info::after { background: var(--info); }

        .metric-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .metric-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            background: var(--bg-card);
            padding: 1rem 1.25rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 0.8rem; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 2px;
        }

        .filter-btn {
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.6rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn-new-order {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: #fff;
            border: none;
            padding: 0.7rem 1.25rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-new-order:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .orders-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        .order-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .order-card:hover {
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .order-img-container {
            height: 140px;
            width: 100%;
            position: relative;
            overflow: hidden;
            background: #1a2233;
        }

        .order-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: transform 0.4s ease;
        }

        .order-card:hover .order-img-container img {
            transform: scale(1.05);
            opacity: 1;
        }

        .order-card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 1;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-id {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .order-time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-cooking { background: rgba(6, 182, 212, 0.15); color: var(--info); border: 1px solid rgba(6, 182, 212, 0.3); }
        .status-delivery { background: rgba(139, 92, 246, 0.15); color: var(--accent); border: 1px solid rgba(139, 92, 246, 0.3); }
        .status-done { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

        .order-items {
            font-size: 0.9rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 0;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .order-total {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .order-actions select {
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            box-shadow: var(--shadow);
            position: relative;
            transform: scale(0.95);
            transition: var(--transition);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-group input, .form-group select {
            background: var(--bg-base);
            border: 1px solid var(--border);
            padding: 0.8rem 1rem;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: var(--transition);
        }

        .btn-submit:hover { opacity: 0.9; }

        .close-modal {
            position: absolute;
            top: 1.2rem; right: 1.2rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .close-modal:hover { color: #fff; }

        .toast {
            position: fixed;
            bottom: 2rem; right: 2rem;
            background: var(--bg-surface);
            border: 1px solid var(--success);
            color: var(--text-main);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            z-index: 300;
            transform: translateY(100px);
            opacity: 0;
            transition: var(--transition);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media(max-width: 600px) {
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-box">
                <div class="logo-icon">N</div>
                <div class="logo-text">NEXUS <span>OS</span></div>
            </div>
            <select class="store-selector" id="storeSelect">
                <option value="store1">🛒 Магазин №1 (Центральный)</option>
                <option value="store2">🏬 ТРЦ «Мега» (Филиал)</option>
                <option value="store3">📦 Складской узел «Север»</option>
            </select>
        </div>
    </header>

    <main class="main-wrapper">
        <section class="metrics-grid">
            <div class="metric-card success">
                <div class="metric-title">Выручка за сегодня</div>
                <div class="metric-value" id="metricRevenue">148 950 ₽</div>
            </div>
            <div class="metric-card warning">
                <div class="metric-title">Активные заказы</div>
                <div class="metric-value" id="metricActive">4</div>
            </div>
            <div class="metric-card info">
                <div class="metric-title">Среднее время сборки</div>
                <div class="metric-value">12 мин</div>
            </div>
        </section>

        <section class="control-panel">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Поиск по ID или клиенту...">
            </div>
            
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="pending">Новые</button>
                <button class="filter-btn" data-filter="cooking">Сборка</button>
                <button class="filter-btn" data-filter="delivery">Доставка</button>
                <button class="filter-btn" data-filter="done">Готово</button>
            </div>

            <button class="btn-new-order" onclick="openModal()">+ Новый заказ</button>
        </section>

        <section class="orders-container" id="ordersGrid"></section>
    </main>

    <div class="modal-overlay" id="orderModal">
        <div class="modal-card">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div class="modal-title">Новый заказ</div>
            <form id="newOrderForm" onsubmit="addOrder(event)">
                <div class="form-group">
                    <label>Имя клиента</label>
                    <input type="text" id="clientNameInput" required placeholder="Алексей Смирнов">
                </div>
                <div class="form-group">
                    <label>Состав заказа</label>
                    <input type="text" id="itemsInput" required placeholder="Смартфон, Гаджеты">
                </div>
                <div class="form-group">
                    <label>Сумма (₽)</label>
                    <input type="number" id="priceInput" required placeholder="45900">
                </div>
                <button type="submit" class="btn-submit">Создать заказ</button>
            </form>
        </div>
    </div>

    <div class="toast" id="toast">Заказ успешно добавлен в систему!</div>

    <script>
        let orders = [
            { 
                id: "#NX-8041", 
                client: "Артем Васильев", 
                time: "10:14", 
                status: "pending", 
                items: "Беспроводные наушники Pro", 
                total: "8 990 ₽",
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80"
            },
            { 
                id: "#NX-8040", 
                client: "Елена Макарова", 
                time: "10:02", 
                status: "cooking", 
                items: "Планшет Tab 10.4, Стилус", 
                total: "32 450 ₽",
                image: "https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?auto=format&fit=crop&w=600&q=80"
            },
            { 
                id: "#NX-8039", 
                client: "Иван Сергеев", 
                time: "09:45", 
                status: "delivery", 
                items: "Игровой ноутбук 15.6\"", 
                total: "89 990 ₽",
                image: "https://images.unsplash.com/photo-1603302576837-37561b2e2302?auto=format&fit=crop&w=600&q=80"
            },
            { 
                id: "#NX-8038", 
                client: "Ольга Новикова", 
                time: "09:20", 
                status: "done", 
                items: "Электрический чайник, Набор чашек", 
                total: "4 200 ₽",
                image: "https://images.unsplash.com/photo-1546868871-7041f2a55e12?auto=format&fit=crop&w=600&q=80"
            }
        ];

        let currentFilter = 'all';

        const ordersGrid = document.getElementById('ordersGrid');
        const searchInput = document.getElementById('searchInput');
        const orderModal = document.getElementById('orderModal');
        const toast = document.getElementById('toast');
        const metricActive = document.getElementById('metricActive');

        const defaultImages = [
            "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1526738549149-8e07eca6c147?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&fit=crop&w=600&q=80"
        ];

        function renderOrders() {
            const query = searchInput.value.toLowerCase().trim();
            
            let filtered = orders.filter(order => {
                const matchFilter = currentFilter === 'all' || order.status === currentFilter;
                const matchSearch = order.id.toLowerCase().includes(query) || order.client.toLowerCase().includes(query);
                return matchFilter && matchSearch;
            });

            metricActive.textContent = orders.filter(o => o.status !== 'done').length;

            ordersGrid.innerHTML = filtered.map(order => {
                let statusText = '';
                if(order.status === 'pending') statusText = 'Новый';
                if(order.status === 'cooking') statusText = 'Сборка';
                if(order.status === 'delivery') statusText = 'Доставка';
                if(order.status === 'done') statusText = 'Выполнено';

                return `
                    <div class="order-card">
                        <div class="order-img-container">
                            <img src="${order.image}" alt="Товар по заказу">
                        </div>
                        <div class="order-card-body">
                            <div class="order-header">
                                <div>
                                    <div class="order-id">${order.id}</div>
                                    <div class="order-time">${order.client} • ${order.time}</div>
                                </div>
                                <span class="status-badge status-${order.status}">${statusText}</span>
                            </div>
                            <div class="order-items">
                                📦 ${order.items}
                            </div>
                            <div class="order-footer">
                                <div class="order-total">${order.total}</div>
                                <div class="order-actions">
                                    <select onchange="updateStatus('${order.id}', this.value)">
                                        <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Новый</option>
                                        <option value="cooking" ${order.status === 'cooking' ? 'selected' : ''}>Сборка</option>
                                        <option value="delivery" ${order.status === 'delivery' ? 'selected' : ''}>Доставка</option>
                                        <option value="done" ${order.status === 'done' ? 'selected' : ''}>Выполнено</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStatus(id, newStatus) {
            const order = orders.find(o => o.id === id);
            if(order) {
                order.status = newStatus;
                renderOrders();
            }
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderOrders();
            });
        });

        searchInput.addEventListener('input', renderOrders);

        function openModal() {
            orderModal.classList.add('active');
        }

        function closeModal() {
            orderModal.classList.remove('active');
        }

        orderModal.addEventListener('click', (e) => {
            if(e.target === orderModal) closeModal();
        });

        function addOrder(e) {
            e.preventDefault();
            const name = document.getElementById('clientNameInput').value;
            const items = document.getElementById('itemsInput').value;
            const price = document.getElementById('priceInput').value;

            const newId = '#NX-' + Math.floor(1000 + Math.random() * 9000);
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const randomImg = defaultImages[Math.floor(Math.random() * defaultImages.length)];

            orders.unshift({
                id: newId,
                client: name,
                time: now,
                status: 'pending',
                items: items,
                total: Number(price).toLocaleString() + ' ₽',
                image: randomImg
            });

            closeModal();
            renderOrders();

            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);

            document.getElementById('newOrderForm').reset();
        }

        renderOrders();
    </script>
</body>
</html>
